5<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Telkom shop</title>
    </head>
    <body>
    <header>
        <h1 class="judul">Telkom Shop</h1>
    </header>
        <main class="daftar-produk">
            <div class="kartu">
                <img src="Garam.png" class="garam" alt="Garam">
                <h2 class="nama-produk">Garam</h2>
                <p class="harga">Rp. 5.000</p>
            </div>

            <div class="kartu">
                <img src="Gula.png" class="gula" alt="Gula">
                <h2 class="nama-produk">Gula</h2>
                <p class="harga">Rp. 10.000</p>
            </div>
        
            <div class="kartu">
                <img src="img/Susu-ultramilk.png" class="susu" alt="Susu Ultramilk">
                <h2 class="nama-produk">Susu Ultramilk</h2>
                <p class="harga">Rp. 15.000</p>
            </div>
        </main>

        <form id="formpesan" class="form-pesan" action="#" method="get">
            <h2>Form Pemesanan</h2>

            <label for="nama">Nama Pemesan</label>
            <input type="text" id="nama" required minlength="3" maxlength="50">

            <label for="hp">Nomor HP</label>
            <input type="tel" id="hp" name="hp" required pattern="[0-9]{10,13}"
             inputmode="numeric">

            <label for="produk">Produk</label>
            <select id="produk" name="produk" required>
                <option value="">-- Pilih --</option>
                <option value="garam">Garam</option>
                <option value="gula">Gula</option>
                <option value="susu">Susu Ultramilk</option>
            </select>

            <label for="jumlah">Jumlah</label>
            <input type="number" id="jumlah" name="jumlah" required min="1" max="20">

            <fieldset>
                <legend>Metode Bayar</legend>
                <label class="pilihan"><input type="radio" name="bayar" value="transfer" required> Transfer</label>
                <label class="pilihan"><input type="radio" name="bayar" value="cod"> COD</label>
            </fieldset>

            <label for="alamat">Alamat</label>
            <textarea id="alamat" name="alamat" required minlength="10" maxlength="200"></textarea>

            <button type="submit">Pesan</button>
        </form>

    <footer>
        <p>&copy; 2026 Telkom Shop</p>
        <p>Kontak: <a href="mailto:info@telkomshop.com">info@telkomshop.com</a></p>
    </footer>
    </body>
</html>
